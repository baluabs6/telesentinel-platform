services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: telesentinel
      POSTGRES_USER: ts
      POSTGRES_PASSWORD: ts_dev_pw
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
volumes:
  pgdata:
  mongodata:
