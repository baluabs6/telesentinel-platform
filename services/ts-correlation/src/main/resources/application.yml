server:
  port: 8083
spring:
  application:
    name: ts-correlation
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/telesentinel}
    username: ${PG_USER:ts}
    password: ${PG_PASSWORD:ts_dev_pw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: correlation
  flyway:
    schemas: correlation
    default-schema: correlation
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ts-correlation
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.telesentinel.correlation.model.AlarmEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.telesentinel.correlation.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
telesentinel:
  topics:
    alarms: telesentinel.alarms
    incidents: telesentinel.incidents
  correlation:
    active-alarm-ttl-seconds: 3600   # safety net for senders that never send CLEARED
    resolve-grace-seconds: 30
    evaluation-interval-ms: 10000
    topology:
      nodes:           # in production, load this from your inventory/CMDB
        core-1:        { subscribers: 0 }
        agg-router-12: { parent: core-1 }
        agg-router-13: { parent: core-1 }
        gnb-204:       { parent: agg-router-12, subscribers: 4200 }
        gnb-205:       { parent: agg-router-12, subscribers: 3800 }
        gnb-301:       { parent: agg-router-13, subscribers: 5100 }
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
