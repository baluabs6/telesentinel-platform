server:
  port: 8080
spring:
  application:
    name: ts-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:9000/jwks}
  cloud:
    gateway:
      server:
        webflux:            # Spring Cloud 2025.0 prefix (was spring.cloud.gateway.routes)
          routes:
            - id: ingestion
              uri: ${INGESTION_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/alarms,/api/v1/cdrs,/api/v1/cdrs/batch
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 500
                    redis-rate-limiter.burstCapacity: 1000
                    key-resolver: "#{@clientKeyResolver}"
            - id: fraud
              uri: ${FRAUD_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/fraud/**
            - id: correlation
              uri: ${CORRELATION_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/incidents/**
            - id: rag-assistant
              uri: ${RAG_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/assistant/**,/api/v1/knowledge/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@clientKeyResolver}"
telesentinel:
  security:
    enabled: ${SECURITY_ENABLED:true}   # set false for local development only
    audience: ${JWT_AUDIENCE:}          # required when security is enabled, e.g. api://telesentinel
management:
  endpoints:
    web:
      exposure:
        include: health,info
