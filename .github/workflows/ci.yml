name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC to Azure and AWS, no stored cloud keys
    strategy:
      fail-fast: false
      matrix:
        service: [ts-ingestion, ts-fraud, ts-correlation, ts-rag-assistant, ts-gateway, ts-notification]
    env:
      IMAGE: telesentinel/${{ matrix.service }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # ---- Push to ACR (primary) on main ----
      - name: Azure login
        if: github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        if: github.ref == 'refs/heads/main' && vars.ACR_NAME != ''
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          REMOTE="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "$REMOTE"
          docker push "$REMOTE"

      # ---- Push to ECR (disaster recovery) on main ----
      - name: AWS login
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DR_REGION }}
      - name: Push to ECR
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push to ECR (tags are immutable, so skip if present)
        if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
        run: |
          if aws ecr describe-images --repository-name "${IMAGE}" --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "Tag already in ECR, skipping"
          else
            REMOTE="${{ steps.ecr.outputs.registry }}/${IMAGE}:${TAG}"
            docker tag "${IMAGE}:${TAG}" "$REMOTE"
            docker push "$REMOTE"
          fi
