{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: telesentinel
  {{- if and $.Values.global.workloadIdentity.enabled $.Values.global.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ $.Values.global.workloadIdentity.clientId | quote }}
  {{- end }}
{{- end }}
{{- end }}
