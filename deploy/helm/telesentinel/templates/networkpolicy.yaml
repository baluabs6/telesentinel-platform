{{- if .Values.global.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
# Ingress is denied unless allowed below: the gateway (ingress: true) is open to the ingress
# controller, other services only accept traffic from the pods listed in allowFrom.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress]
  ingress:
    {{- if $svc.ingress }}
    - ports:
        - port: {{ $svc.port }}
    {{- else if $svc.allowFrom }}
    - from:
        {{- range $svc.allowFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - port: {{ $svc.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
